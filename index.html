<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <meta name="description" content="32题帮你找到最适合的男友类型，7种男友哪款更适合你？">
  <meta property="og:title" content="测一测，哪一款男友更适合你？">
  <meta property="og:description" content="32题·约3分钟·7种男友类型">
  <meta property="og:type" content="website">
  <title>哪一款男友更适合你？</title>
  <style>
    :root {
      --bg: #fff5f5;
      --card: #ffffff;
      --primary: #e8917a;
      --accent: #f4b8a8;
      --text: #3d2c2c;
      --muted: #9b7b7b;
      --border: #f8e0d8;
      --shadow: 0 4px 24px rgba(200, 140, 120, .12);
      --pink-light: #fff0ed;
      --gold: #d4a76a
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0
    }

    #app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: 20px 16px 40px
    }

    /* @media(min-width:768px) {
      #app {
        display: none
      }
    }

    @media(min-width:768px) {
      #desktop-hint {
        display: flex;
        position: fixed;
        inset: 0;
        background: #fff;
        justify-content: center;
        align-items: center;
        font-size: 18px;
        color: #999;
        flex-direction: column;
        gap: 12px;
        z-index: 9999
      }

      .hint-icon {
        font-size: 48px
      }
    } */


    @media(min-width:768px) {
      #app {
        max-width: 720px
      }
    }

    #desktop-hint {
      display: none
    }

    .screen {
      display: none;
      animation: fadeIn .4s ease
    }

    .screen.active {
      display: block
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    /* Landing */
    .landing {
      text-align: center;
      padding-top: 32px
    }

    .landing .emoji {
      font-size: 56px;
      margin-bottom: 12px
    }

    .landing h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      margin-bottom: 10px
    }

    .landing .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 6px
    }

    .landing .features {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 20px 0;
      flex-wrap: wrap
    }

    .landing .feature {
      background: var(--pink-light);
      border-radius: 16px;
      padding: 10px 16px;
      text-align: center
    }

    .landing .feature .num {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary)
    }

    .landing .feature .label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px
    }

    .landing .disclaimer {
      font-size: 11px;
      color: var(--muted);
      margin-top: 18px;
      line-height: 1.5
    }

    /* Buttons */
    .btn {
      display: inline-block;
      padding: 14px 48px;
      border-radius: 30px;
      font-size: 17px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all .25s;
      text-decoration: none;
      text-align: center
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #e07a5a);
      color: #fff;
      box-shadow: 0 6px 20px rgba(232, 145, 122, .35)
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(232, 145, 122, .45)
    }

    .btn-primary:active {
      transform: scale(.97)
    }

    .btn-secondary {
      background: var(--card);
      color: var(--primary);
      border: 2px solid var(--primary)
    }

    .btn-small {
      padding: 10px 28px;
      font-size: 15px
    }

    .btn-block {
      display: block;
      width: 100%
    }

    /* Progress */
    .progress-wrap {
      margin-bottom: 20px
    }

    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 4px
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--primary));
      border-radius: 3px;
      transition: width .3s ease
    }

    .progress-text {
      font-size: 12px;
      color: var(--muted);
      text-align: right
    }

    /* Question */
    .question-screen {
      padding-top: 8px
    }

    .question-dim {
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 12px;
      text-align: center;
      font-weight: 500
    }

    .question-text {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 24px;
      text-align: center;
      color: var(--text)
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .option {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 15px 18px;
      cursor: pointer;
      transition: all .2s ease;
      display: flex;
      align-items: center;
      gap: 12px
    }

    .option:hover {
      border-color: var(--accent);
      transform: translateX(3px)
    }

    .option:active {
      transform: scale(.98)
    }

    .option.selected {
      border-color: var(--primary);
      background: var(--pink-light)
    }

    .option .letter {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: var(--primary);
      flex-shrink: 0
    }

    .option.selected .letter {
      background: var(--primary);
      color: #fff
    }

    .option .text {
      font-size: 15px;
      line-height: 1.4;
      color: var(--text);
      flex: 1
    }

    /* Loading */
    .loading-screen {
      text-align: center;
      padding-top: 60px
    }

    .loading-screen .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid var(--border);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      margin: 0 auto 24px;
      animation: spin .8s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .loading-screen .msg {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 6px
    }

    /* Results */
    .result-card {
      background: var(--card);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 16px
    }

    .result-header {
      text-align: center;
      margin-bottom: 16px
    }

    .result-header .badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary), #e07a5a);
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      padding: 8px 24px;
      border-radius: 24px;
      margin-bottom: 8px
    }

    .result-header .tagline {
      font-size: 15px;
      color: var(--text);
      font-weight: 600;
      line-height: 1.4
    }

    .result-image {
      text-align: center;
      margin: 16px 0
    }

    .result-image img {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(180, 120, 100, .15);
      object-fit: cover
    }

    .result-image .img-placeholder {
      width: 100%;
      aspect-ratio: 3/4;
      min-height: 280px;
      background: var(--pink-light);
      border-radius: 16px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px
    }

    /* Bar Chart */
    .chart-title {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 12px;
      font-weight: 500
    }

    .bar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px
    }

    .bar-label {
      width: 52px;
      font-size: 12px;
      color: var(--muted);
      text-align: right;
      flex-shrink: 0;
      line-height: 1.2
    }

    .bar-track {
      flex: 1;
      height: 24px;
      background: var(--border);
      border-radius: 12px;
      overflow: hidden
    }

    .bar-fill {
      height: 100%;
      border-radius: 12px;
      transition: width 1s ease;
      display: flex;
      align-items: center;
      padding-left: 10px;
      font-size: 11px;
      color: #fff;
      font-weight: 600;
      min-width: 36px;
      background: var(--accent)
    }

    .bar-fill.winner {
      background: linear-gradient(135deg, var(--primary), #e07a5a)
    }

    /* Detail sections */
    .detail-section {
      margin-bottom: 12px
    }

    .detail-section h3 {
      font-size: 15px;
      color: var(--primary);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 5px
    }

    .detail-section p {
      font-size: 14px;
      color: var(--text);
      line-height: 1.75
    }

    .tip-list {
      list-style: none;
      padding: 0
    }

    .tip-list li {
      position: relative;
      padding: 8px 0 8px 22px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
      border-bottom: 1px solid var(--border)
    }

    .tip-list li:before {
      content: "💗";
      position: absolute;
      left: 0;
      font-size: 11px
    }

    .tip-list li:last-child {
      border-bottom: none
    }

    .motto {
      text-align: center;
      padding: 16px;
      margin: 16px 0;
      background: linear-gradient(135deg, var(--pink-light), #fff8f6);
      border-radius: 16px;
      font-size: 15px;
      color: var(--primary);
      font-weight: 600;
      line-height: 1.5
    }

    .share-section {
      text-align: center;
      margin-top: 12px
    }

    .share-section p {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px
    }
  </style>
</head>

<body>
  <div id="desktop-hint" style="display:none">
    <div class="hint-icon">📱</div>请使用移动端浏览器访问
  </div>
  <div id="app">
    <!-- Landing -->
    <div class="screen active" id="landing">
      <div class="landing">
        <div class="emoji">💘</div>
        <h1>测一测<br>哪一款男友更适合你？</h1>
        <p class="subtitle">32道题 · 约3分钟 · 7种男友类型</p>
        <div class="features">
          <div class="feature">
            <div class="num">4</div>
            <div class="label">诊断维度</div>
          </div>
          <div class="feature">
            <div class="num">7</div>
            <div class="label">男友类型</div>
          </div>
          <div class="feature">
            <div class="num">32</div>
            <div class="label">精选题目</div>
          </div>
          <div class="feature">
            <div class="num">3min</div>
            <div class="label">约3分钟</div>
          </div>
        </div>
        <button class="btn btn-primary" onclick="startTest()">开始测试</button>
        <p class="disclaimer">⚠️ 纯趣味测试，非科学评估，结果仅供娱乐参考</p>
      </div>
    </div>
    <!-- Question -->
    <div class="screen" id="question">
      <div class="question-screen">
        <div class="progress-wrap">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width:3%"></div>
          </div>
          <div class="progress-text" id="progressText">1/32</div>
        </div>
        <div class="question-dim" id="questionDim"></div>
        <div class="question-text" id="questionText"></div>
        <div class="options" id="options"></div>
      </div>
    </div>
    <!-- Loading -->
    <div class="screen" id="loading">
      <div class="loading-screen">
        <div class="spinner"></div>
        <p class="msg">正在为你匹配最适合的男友类型…</p>
      </div>
    </div>
    <!-- Results -->
    <div class="screen" id="results">
      <div class="result-header">
        <div class="badge" id="resultType"></div>
        <p class="tagline" id="resultTagline"></p>
      </div>
      <div class="result-image" id="resultImage"></div>
      <div class="result-card">
        <div class="chart-title">📊 7种男友类型适配度</div>
        <div id="barsSection"></div>
      </div>
      <div class="result-card">
        <div class="detail-section">
          <h3>🔍 深度分析</h3>
          <p id="resultDesc"></p>
        </div>
        <div class="detail-section">
          <h3>💡 恋爱建议</h3>
          <ul class="tip-list" id="adviceList"></ul>
        </div>
      </div>
      <div class="motto" id="mottoText"></div>
      <div class="share-section">
        <button class="btn btn-secondary btn-small" onclick="restartTest()">🔄 重新测试</button>
        <p style="margin-top:10px">截屏分享你的适配男友类型给闺蜜吧～</p>
      </div>
    </div>
  </div>

  <script src="quiz.js"></script>

</body>

</html>
